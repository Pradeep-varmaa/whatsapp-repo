services:
  # Microsoft SQL Server (Linux-based container)
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: whatsapp_engine_mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD:-YourStrong@Passw0rd!}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Broker for BullMQ
  redis:
    image: redis:7-alpine
    container_name: whatsapp_engine_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Next.js Web Application
  app:
    build:
      context: .
      target: runner
    container_name: whatsapp_engine_app
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - MSSQL_HOST=mssql
      - REDIS_HOST=redis
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Dedicated BullMQ Background Worker
  worker:
    build:
      context: .
      target: worker
    container_name: whatsapp_engine_worker
    env_file:
      - .env.local
    environment:
      - MSSQL_HOST=mssql
      - REDIS_HOST=redis
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mssql_data:
  redis_data:
